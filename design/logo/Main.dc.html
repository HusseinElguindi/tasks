<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks icon directions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 900px; box-sizing: border-box; padding: 48px 62px; background: #111111; color: #E6EDF3; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 28px;">
<header style="display: flex; flex-direction: column; gap: 6px;">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600;">Tasks · app icon directions</h1>
<p style="margin: 0; font-size: 15px; line-height: 20px; color: #A8ADB1;">Seven marks in the Pane vocabulary, each at 160, 32 and 16 in dark and light. Chosen: 04 Log.</p>
</header>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 24px;">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="7">
<article style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 8px; height: 22px;">
<span style="font: 600 12px/16px 'SF Mono', ui-monospace, Menlo, monospace; color: #7F8386;">{{m.num}}</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 600;">{{m.name}}</span>
<sc-if value="{{m.rec}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; height: 20px; padding: 0 8px; border-radius: 10px; background: #1E2938; color: #5799F6; font-size: 11px; line-height: 20px; font-weight: 600;">{{m.recLabel}}</span></sc-if>
</div>
<div style="height: 280px; border-radius: 14px; background: #181818; box-shadow: inset 0 0 0 1px #262728; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
<dc-import name="Icon" mark="{{m.id}}" look="dark" size="{{n160}}" hint-size="160px,160px"></dc-import>
<div style="display: flex; align-items: flex-end; gap: 18px;">
<dc-import name="Icon" mark="{{m.id}}" look="dark" size="{{n32}}" hint-size="32px,32px"></dc-import>
<dc-import name="Icon" mark="{{m.id}}" look="dark" size="{{n16}}" hint-size="16px,16px"></dc-import>
</div>
</div>
<div style="height: 280px; border-radius: 14px; background: #EDEDEE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
<dc-import name="Icon" mark="{{m.id}}" look="light" size="{{n160}}" hint-size="160px,160px"></dc-import>
<div style="display: flex; align-items: flex-end; gap: 18px;">
<dc-import name="Icon" mark="{{m.id}}" look="light" size="{{n32}}" hint-size="32px,32px"></dc-import>
<dc-import name="Icon" mark="{{m.id}}" look="light" size="{{n16}}" hint-size="16px,16px"></dc-import>
</div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #A8ADB1;">{{m.line}}</p>
</article>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const marks = [
{ id: 'row', num: '01', name: 'Row', line: 'The selected capsule is the app’s one strong state: a single task, picked and checked.' },
{ id: 'split', num: '02', name: 'Split', line: 'The detail pane sliding open beside the list, the move the whole window is built on.' },
{ id: 'rise', num: '03', name: 'Rise', line: 'Today’s sun coming up behind a task row: the view you open first each morning.' },
{ id: 'log', num: '04', name: 'Log', line: 'Sync is a hash-chained, append-only log; the newest op at its head is a checked task.', rec: true, recLabel: 'Chosen' },
{ id: 'tile', num: '05', name: 'Tile', line: 'The list monogram tile, scaled up. Its letter follows the name, so it changes if Tasks does.' },
{ id: 'cursor', num: '06', name: 'Cursor', line: 'A check, then the block cursor waiting for the next task, in Rex’s cursor blue.' },
{ id: 'gap', num: '07', name: 'Gap', line: 'Drag-to-reorder’s insertion line and ring, parting two rows to make room.' }
];
return { marks: marks.map(m => ({ rec: false, recLabel: '', ...m })), n160: 160, n32: 32, n16: 16 };
}
}
</script>
</body>
</html>
