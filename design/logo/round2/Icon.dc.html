<script type="text/x-dc" data-dc-script data-props='{"mark":{"editor":"enum","options":["log","spark","ember","fan","steps","letter","breakout","daybreak","cursor","chain","tick","ember-lit","ember-mark","ember-mix","fan-lit","fan-tight","fan-today","spark-box","spark-round","spark-ring","tick-refined","tick-lit","tick-body","blank"],"default":"ember-mark"},"look":{"editor":"enum","options":["dark","light","tinted","clear"],"default":"dark"},"shape":{"editor":"enum","options":["mac","ios"],"default":"mac"},"size":{"editor":"int","min":16,"max":1024,"default":512},"tint":{"editor":"color","default":"#8FB3FF"},"$preview":{"width":512,"height":512}}'>
class Component extends DCLogic {
renderVals() {
const mark = this.props.mark ?? 'ember-mark';
const shape = this.props.shape ?? 'mac';
const size = Number(this.props.size ?? 512);
const tint = this.props.tint ?? '#8FB3FF';
let look = this.props.look ?? 'dark';

const sm = size < 60; // the small cut: fewer, thicker parts below 60px
const mono = look === 'tinted' || look === 'clear';
const EM = 'url(#tk-em)', EMBER = '#E6683D';
const L = {
dark: { ink: '#F2F3F4', cut: '#1E1E1E', spark: '#E68565', body: 'url(#tk-bd)', rim: 'rgba(255,255,255,0.10)', blank: '#3A3B3D', halo: 'rgba(0,0,0,0.35)' },
light: { ink: '#1C1C1C', cut: '#FFFFFF', spark: '#E6683D', body: 'url(#tk-bl)', rim: 'rgba(0,0,0,0.10)', blank: '#C9CACC', halo: 'rgba(0,0,0,0.18)' },
tinted: { ink: '#F2F3F4', cut: '#1E1E1E', spark: tint, body: 'url(#tk-bd)', rim: 'rgba(255,255,255,0.10)', blank: '#3A3B3D', halo: 'rgba(0,0,0,0.35)' },
clear: { ink: 'rgba(255,255,255,0.92)', cut: 'rgba(40,44,52,0.55)', spark: 'rgba(255,255,255,0.6)', body: 'rgba(255,255,255,0.14)', rim: 'rgba(255,255,255,0.42)', blank: 'rgba(255,255,255,0.2)', halo: 'rgba(0,0,0,0.12)' }
}[look];
// A hue in this look: as it is in dark and light; tinted takes the tint, clear takes white, stepping down by depth.
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const hue = (hex, depth) => look === 'tinted' ? hexA(tint, [1, 0.62, 0.38][depth || 0]) : look === 'clear' ? `rgba(255,255,255,${[0.42, 0.26, 0.16][depth || 0]})` : hex;
const r1 = (n) => Math.round(n * 10) / 10;
const rr = (x, y, w, h, r) => `M${r1(x + r)} ${r1(y)}H${r1(x + w - r)}A${r1(r)} ${r1(r)} 0 0 1 ${r1(x + w)} ${r1(y + r)}V${r1(y + h - r)}A${r1(r)} ${r1(r)} 0 0 1 ${r1(x + w - r)} ${r1(y + h)}H${r1(x + r)}A${r1(r)} ${r1(r)} 0 0 1 ${r1(x)} ${r1(y + h - r)}V${r1(y + r)}A${r1(r)} ${r1(r)} 0 0 1 ${r1(x + r)} ${r1(y)}Z`;
const ci = (cx, cy, r) => `M${r1(cx - r)} ${r1(cy)}A${r1(r)} ${r1(r)} 0 1 0 ${r1(cx + r)} ${r1(cy)}A${r1(r)} ${r1(r)} 0 1 0 ${r1(cx - r)} ${r1(cy)}Z`;
const pol = (cx, cy, r, a) => { const t = a * Math.PI / 180; return [r1(cx + r * Math.cos(t)), r1(cy + r * Math.sin(t))]; };
const F = (d, f, t) => ({ d, f, s: 'none', w: 0, c: 'round', t: t || '' });
const S = (d, s, w, c, t) => ({ d, f: 'none', s, w, c: c || 'round', t: t || '' });
const ray = (cx, cy, a, ra, rb, w, col) => { const p = pol(cx, cy, ra, a), q = pol(cx, cy, rb, a); return S(`M${p[0]} ${p[1]}L${q[0]} ${q[1]}`, col, w); };
// A check through three points, scaled by k about (cx, cy) and moved to (ox, oy).
const chk = (pts, k, ox, oy) => 'M' + pts.map(([x, y]) => `${r1(ox + x * k)} ${r1(oy + y * k)}`).join('L');
// The lit finish on a rounded rectangle (TileArt.draw, bottom to top), at the source's scale: one unit is the tile's
// height / 45.54. Halo: the outer half of a 1-unit stroke (0.5 unit, black 35% dark / 18% light). Fill: the flat hue.
// Light: tk-light. Specular: a 1-unit strip along the top edge. Ring: a 1-unit ring inside the edge, white 10%.
const litRR = (x, y, w, h, r, fill, t, gap) => {
const u = h / 45.54, out = [];
if (gap) out.push(S(rr(x, y, w, h, r), L.cut, gap * 2, 'round', t));
out.push(S(rr(x, y, w, h, r), L.halo, u, 'round', t));
out.push(F(rr(x, y, w, h, r), fill, t));
out.push(F(rr(x, y, w, h, r), 'url(#tk-light)', t));
out.push(F(rr(x + r * 0.7, y, w - r * 1.4, u, u / 2), 'url(#tk-spec)', t));
out.push(S(rr(x + u / 2, y + u / 2, w - u, h - u, r - u / 2), 'rgba(255,255,255,0.10)', u, 'round', t));

};
// The round one, as TileArt draws the brand mark's head: no specular.
const litCircle = (cx, cy, r, fill) => {
const u = 2 * r / 45.54;
return [S(ci(cx, cy, r), L.halo, u), F(ci(cx, cy, r), fill), F(ci(cx, cy, r), 'url(#tk-light)'), S(ci(cx, cy, r - u / 2), 'rgba(255,255,255,0.10)', u)];
};
// Today's sun (Draw.swift Glyph.sun, a 16-unit box stroked 1.5), as the app draws it on Today's tile: 0.75 of the tile's height.
const sun = (cx, cy, box, col) => {
const k = box / 16, t = `translate(${r1(cx - 8 * k)} ${r1(cy - 8 * k)}) scale(${r1(k * 100) / 100})`, w = sm ? 2.2 : 1.5;
return [S('M8 1.9v1.3M8 12.8v1.3M1.9 8h1.3M12.8 8h1.3M3.7 3.7l.9.9M11.4 11.4l.9.9M3.7 12.3l.9-.9M11.4 4.6l.9-.9', col, w, 'round', t), S(ci(8, 8, 2.6), col, w, 'round', t)];
};
let shapes = [];
let bodyFill = L.body, bodyLit = false;

if (mark === 'log') {
// 00 Current: the shipped 04 Log, from ios/Tools/MakeIcon.swift (mark viewBox 150..874 drawn 640 wide).
const K = 640 / 724, X = (v) => 192 + (v - 150) * K, U = (v) => v * K;
const trail = '#6D7072', ring = '#A8ADB1', ink = '#E6EDF3', head = '#2F81F7', cut = '#1C1C1C';
shapes = [
F(rr(X(304), X(436), U(36), U(64), 0.01), trail), F(rr(X(304), X(612), U(36), U(64), 0.01), trail),
F(rr(X(462), X(524), U(280), U(64), U(32)), trail), F(rr(X(462), X(700), U(220), U(64), U(32)), trail),
sm ? F(ci(X(322), X(556), U(56)), ring) : S(ci(X(322), X(556), U(45)), ring, U(22)),
sm ? F(ci(X(322), X(732), U(56)), ring) : S(ci(X(322), X(732), U(45)), ring, U(22)),
F(rr(X(462), X(296), U(340), U(80), U(40)), ink), F(ci(X(322), X(336), U(90)), head),
S(`M${r1(X(282))} ${r1(X(338))}L${r1(X(310))} ${r1(X(366))}L${r1(X(362))} ${r1(X(306))}`, cut, U(26))
];
} else if (mark === 'spark') {
// 01 Spark (round 2): the Ember checkbox with the completion spark's eight rays.
const box = sm ? 440 : 380, o = 512 - box / 2;
shapes.push(F(rr(o, o, box, box, box * 0.26), EM));
for (let a = 0; a < 360; a += 45) {
const diag = a % 90 !== 0;
shapes.push(ray(512, 512, a, diag ? (sm ? 300 : 268) : (sm ? 262 : 236), diag ? (sm ? 372 : 336) : (sm ? 352 : 318), sm ? 60 : 40, L.spark));
}
shapes.push(S('M418 520L488 590L614 446', '#FFFFFF', sm ? 70 : 56));
} else if (mark === 'spark-box' || mark === 'spark-ring') {
// 01a Lit box: the checked box with the rays gone and the list mark's finish. 01c keeps the spark's ring.
const ring = mark === 'spark-ring';
const box = ring ? (sm ? 470 : 420) : (sm ? 560 : 500), o = 512 - box / 2, k = box / 380;
if (ring) shapes.push(S(ci(512, 512, sm ? 338 : 318), mono ? hue(EMBER, 1) : L.spark, sm ? 52 : 30));
shapes.push(...litRR(o, o, box, box, box * 0.26, hue(EMBER)));
shapes.push(S(chk([[-94, 8], [-24, 78], [102, -66]], k, 512, 512), '#FFFFFF', (sm ? 66 : 56) * k));
} else if (mark === 'spark-round') {
// 01b Lit round: the app's own checked box, which is round, lit as the brand mark's head (no specular).
const r = sm ? 300 : 270, k = r / 190;
shapes.push(...litCircle(512, 512, r, hue(EMBER)));
shapes.push(S(chk([[-94, 8], [-24, 78], [102, -66]], k, 506, 508), '#FFFFFF', (sm ? 64 : 54) * k));

// 02 Ember tile (round 2): light is the Ember tile with a white check; dark keeps the dark body and the check goes Ember.
if (look === 'light') bodyFill = EM;
shapes = [S('M318 530L448 660L712 380', look === 'light' ? '#FFFFFF' : mono ? hue(EMBER) : EM, sm ? 120 : 100)];
} else if (mark === 'ember-lit' || mark === 'ember-mark' || mark === 'ember-mix') {
// 02a Lit body: the whole body is the lit tile, in both appearances (tiles don't change with it; only the halo does).
// 02b List mark: a 20×16 list mark (radius 4 of 20) on the plain body. 02c: 02a in light, 02b in dark.
const whole = mark === 'ember-lit' || (mark === 'ember-mix' && look === 'light');
if (whole && !mono) {
bodyFill = EMBER; bodyLit = true;
shapes = [S('M318 530L448 660L712 380', '#FFFFFF', sm ? 120 : 100)];
} else if (whole) {
shapes = [S('M318 530L448 660L712 380', hue(EMBER), sm ? 120 : 100)];
} else {
const w = sm ? 700 : 640, h = w * 0.8, k = w / 640;
shapes.push(...litRR(512 - w / 2, 512 - h / 2, w, h, w * 0.2, hue(EMBER)));
shapes.push(S(chk([[-130, 8], [-34, 104], [146, -92]], k, 512, 506), '#FFFFFF', (sm ? 96 : 84) * k));
}
} else if (mark === 'fan') {
// 03 Fan (round 2): three list tiles fanned from one corner; the top one is Ember and checked.
const x = 332, y = 425, w = 440, h = 352;
shapes = [
{ ...F(rr(x, y, w, h, 96), '#7C5CD6', 'rotate(-26 290 777)'), s: L.cut, w: 16 },
{ ...F(rr(x, y, w, h, 96), '#17808A', 'rotate(-13 290 777)'), s: L.cut, w: 16 },
{ ...F(rr(x, y, w, h, 96), EM), s: L.cut, w: 16 },
S('M470 601L534 665L652 539', '#FFFFFF', sm ? 64 : 52)
];
} else if (mark === 'fan-lit') {
// 03a Lit fan: round 2's geometry, each tile a list mark (20×16, radius 4 of 20) in the app's own tile hues.
const x = 332, y = 425, w = 440, h = 352, r = 88;
shapes.push(...litRR(x, y, w, h, r, hue('#6B4FB8', 2), 'rotate(-26 290 777)'));
shapes.push(...litRR(x, y, w, h, r, hue('#146E77', 1), 'rotate(-13 290 777)'));
shapes.push(...litRR(x, y, w, h, r, hue(EMBER)));
shapes.push(S('M470 601L534 665L652 539', '#FFFFFF', sm ? 64 : 52));
} else if (mark === 'fan-tight' || mark === 'fan-today') {
// 03b Tight fan: bigger tiles at half the angles, each parted from the next by a body-coloured gap, so the stack
// still reads at 16. 03c puts Today's tile on top: the sun in place of the check, as the sidebar draws it.
const x = 324, y = 379, w = 500, h = 400, r = 100, gap = sm ? 22 : 14;
shapes.push(...litRR(x, y, w, h, r, hue('#6B4FB8', 2), 'rotate(-18 324 779)', gap));
shapes.push(...litRR(x, y, w, h, r, hue('#146E77', 1), 'rotate(-9 324 779)', gap));
shapes.push(...litRR(x, y, w, h, r, hue(EMBER), '', gap));
if (mark === 'fan-today') shapes.push(...sun(574, 579, h * 0.75, '#FFFFFF'));
else shapes.push(S('M502 579L560 637L668 521', '#FFFFFF', sm ? 72 : 60));
} else if (mark === 'tick') {
// 10 Tick (round 2): one heavy check, the short stroke Ember.
const w = sm ? 150 : 132;
shapes = [S('M262 520L432 690', EM, w), S('M432 690L772 330', L.ink, w)];
} else if (mark === 'tick-refined') {
// 10a Refined: optically centred, a step heavier, flat Ember, and the long stroke parted from the short one by a cut.
const w = sm ? 156 : 140;
shapes = [S('M267 529L429 691', mono ? hue(EMBER) : EMBER, w), S('M429 691L757 333', L.cut, w + 28), S('M429 691L757 333', L.ink, w)];
} else if (mark === 'tick-lit') {
// 10b Lit check: the whole check in Ember, with the finish's halo and light on the stroke (no edges, so no ring or strip).
const w = sm ? 156 : 140, d = 'M267 529L429 691L757 333', u = w / 45.54;
shapes = [S(d, L.halo, w + u), S(d, hue(EMBER), w), S(d, 'url(#tk-light)', w)];
} else if (mark === 'tick-body') {
// 10c On a lit body: 02a's lit Ember body, the tick in white with its short stroke at 60%.
const w = sm ? 156 : 140;
if (!mono) { bodyFill = EMBER; bodyLit = true; }
const a = mono ? hue(EMBER) : 'rgba(255,255,255,0.6)', b = mono ? L.ink : '#FFFFFF';
shapes = [S('M267 529L429 691', a, w), S('M429 691L757 333', mono ? L.cut : EMBER, w + 28), S('M429 691L757 333', b, w)];
} else if (mark === 'steps') {
const u = 136, t = sm ? 128 : 122, ox = 512 - 2.5 * u, oy = 512 - 2 * u + 20;
const cells = [[0, 2, '#F29A76'], [1, 3, EM], [2, 2, '#D45A31'], [3, 1, '#BC4F2B'], [4, 0, '#A04325']];
shapes = cells.map(([i, j, col]) => F(rr(ox + i * u + (u - t) / 2, oy + j * u + (u - t) / 2, t, t, t * 0.27), col));
} else if (mark === 'letter') {
const w = sm ? 136 : 120;
shapes = [S('M500 250V640Q500 772 632 772H700', L.ink, w), F(rr(262, 360 - w / 2, 500, w, w / 2), EM)];
} else if (mark === 'breakout') {
const r = 236, w = sm ? 92 : 76, a = pol(512, 512, r, -12), b = pol(512, 512, r, -78);
shapes = [S(`M${a[0]} ${a[1]}A${r} ${r} 0 1 1 ${b[0]} ${b[1]}`, L.ink, w), S('M372 520L474 622L760 300', EM, w + 8)];
} else if (mark === 'daybreak') {
shapes.push(F(ci(512, 500, sm ? 190 : 176), EM));
if (!sm) [-90, -130, -50, -168, -12].forEach((a) => shapes.push(ray(512, 500, a, 222, 290, 44, EM)));
shapes.push({ ...F(rr(232, 482, 560, 330, 112), L.ink), s: L.cut, w: 28 });
shapes.push(S('M418 650L488 720L616 584', L.cut, sm ? 70 : 58));
} else if (mark === 'cursor') {
shapes = [S('M222 548L338 664L556 410', L.ink, sm ? 104 : 88), F(rr(636, 400, sm ? 150 : 136, sm ? 300 : 290, 18), EM)];
} else if (mark === 'chain') {
const w = sm ? 84 : 72;
shapes = [
S(rr(222, 232, 400, 400, 128), L.ink, w), S(rr(402, 392, 400, 400, 128), EM, w),
S('M622 322V462', L.cut, w + 36, 'butt'), S('M622 312V472', L.ink, w, 'butt')
];
} else {
bodyFill = L.blank; // a neutral neighbour in the Dock
}

const none = { d: 'M0 0', f: 'none', s: 'none', w: 0, c: 'round', t: '' };
const vals = {};
for (let i = 0; i < 24; i++) vals['p' + i] = shapes[i] || none;
const ios = shape === 'ios';
return {
...vals,
size,
label: mark === 'blank' ? 'Another app' : 'Tasks app icon',
macShow: ios ? 'none' : 'inline',
iosShow: ios ? 'inline' : 'none',
litShow: bodyLit ? 'inline' : 'none',
bodyFill,
rim: bodyLit ? L.halo : (mark === 'ember' && look === 'light' ? 'rgba(0,0,0,0.06)' : L.rim),
rimW: bodyLit ? 18 : 6,
gt: ios ? 'translate(512 512) scale(1.2427) translate(-512 -512)' : '',
svgStyle: 'display: block; overflow: visible;' + (!ios && size >= 64 ? ' filter: drop-shadow(0 ' + Math.round(size / 64) + 'px ' + Math.round(size / 32) + 'px rgba(0,0,0,0.28));' : '')
};
}
}
