<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar footer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tasks-v2.css">
<link rel="stylesheet" href="sync.css">
<link rel="stylesheet" href="foot.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="{{rootCls}}" style="{{rootStyle}}">
<div style="{{scaleStyle}}">
<sc-if value="{{glass}}"><div class="wall" style="{{winStyle}}"></div></sc-if>
<div class="{{winCls}}" style="{{winStyle}}">
<div class="pane" style="left: {{sbW}}px"><span class="pt">School</span></div>
<nav class="sb" style="width: {{sbW}}px" aria-label="Lists">
<div class="{{sbsCls}}" style="{{sbsStyle}}"><div class="sbc" style="{{contentStyle}}"><div class="sbhead"><svg class="mk" width="18" height="18" viewBox="150 150 724 724" aria-hidden="true"><defs><mask id="mk-chk"><rect x="150" y="150" width="724" height="724" fill="#fff"></rect><path class="mk-chk" d="M276.5 339.5L308 371L367.5 304.5"></path></mask></defs><path class="mk-trail" d="M304 436h36v64h-36zM304 612h36v64h-36z"></path><rect class="mk-trail" x="462" y="524" width="280" height="64" rx="32"></rect><rect class="mk-trail" x="462" y="700" width="220" height="64" rx="32"></rect><circle class="mk-rings" cx="322" cy="556" r="56"></circle><circle class="mk-rings" cx="322" cy="732" r="56"></circle><rect class="mk-bar" x="462" y="296" width="340" height="80" rx="40"></rect><circle class="mk-head" cx="322" cy="336" r="100" mask="url(#mk-chk)"></circle></svg><span>Tasks</span><sc-if value="{{headSync}}"><span class="hsync {{sy.cls}}"><svg class="g" viewBox="0 0 16 16" aria-hidden="true"><defs><mask id="fm-{{gid}}" maskUnits="userSpaceOnUse" x="-2" y="-2" width="20" height="20"><rect x="-2" y="-2" width="20" height="20" fill="#fff"></rect><sc-if value="{{sy.slash}}"><path d="M2.5 1.75l12 12.5" stroke="#000" stroke-width="3.4" stroke-linecap="round"></path></sc-if><sc-if value="{{sy.dot}}"><circle cx="13.2" cy="4" r="3.4" fill="#000"></circle></sc-if><sc-if value="{{sy.excl}}"><path d="M8.25 6.1v3" stroke="#000" stroke-width="1.6" stroke-linecap="round"></path><circle cx="8.25" cy="11.05" r="0.95" fill="#000"></circle></sc-if></mask></defs><g mask="url(#fm-{{gid}})"><path class="{{sy.cloud}}" d="M4.6 12.75h6.9a2.85 2.85 0 0 0 .38-5.67 3.9 3.9 0 0 0-7.55-.55A3.1 3.1 0 0 0 4.6 12.75z"></path></g><sc-if value="{{sy.slash}}"><path class="o" d="M2.5 1.75l12 12.5"></path></sc-if><sc-if value="{{sy.dot}}"><circle class="dot" cx="13.2" cy="4" r="2.1"></circle></sc-if></svg></span></sc-if></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12"><sc-if value="{{r.row}}"><div class="{{r.cls}}" style="{{r.style}}"><span class="{{r.tile}}">{{r.mono}}<sc-if value="{{r.i_today}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.9v1.3M8 12.8v1.3M1.9 8h1.3M12.8 8h1.3M3.7 3.7l.9.9M11.4 11.4l.9.9M3.7 12.3l.9-.9M11.4 4.6l.9-.9"></path><circle cx="8" cy="8" r="2.6"></circle></svg></sc-if><sc-if value="{{r.i_up}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.75" width="11" height="10" rx="2"></rect><path d="M2.5 6.75h11M5.5 2.25v3M10.5 2.25v3"></path></svg></sc-if><sc-if value="{{r.i_und}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5l5.5 2.75L8 8 2.5 5.25z"></path><path d="M2.5 8l5.5 2.75L13.5 8M2.5 10.75l5.5 2.75 5.5-2.75"></path></svg></sc-if><sc-if value="{{r.i_done}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M5.3 8.2l1.9 1.9 3.6-4"></path></svg></sc-if><sc-if value="{{r.i_trash}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.25h10M6.5 4.25V2.75h3v1.5M4.5 4.25l.5 9h6l.5-9"></path></svg></sc-if></span><span class="tl">{{r.name}}</span><span class="ct">{{r.count}}</span></div></sc-if><sc-if value="{{r.label}}"><div class="sbi glabel" style="{{r.style}}"><span class="gl">{{r.name}}</span><sc-if value="{{r.chev}}"><span class="gbtn reveal on" style="top: 6px"><svg class="i i--sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 4l4 4-4 4"></path></svg></span></sc-if></div></sc-if></sc-for>
</div></div>
<sc-if value="{{foot}}"><div class="ft" style="height: {{footH}}px">
<sc-if value="{{footActions}}"><button class="fnew" type="button" aria-label="New List" onMouseEnter="{{tipNew}}" onMouseLeave="{{tipOff}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg><span class="fl">{{newLabel}}</span></button><span class="fsp"></span><button class="fb" type="button" aria-label="Settings" onMouseEnter="{{tipSet}}" onMouseLeave="{{tipOff}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h3.2M8.3 4.5h5.2M2.5 8h7.2M12.3 8h1.2M2.5 11.5h1.7M6.8 11.5h6.7"></path><circle cx="7" cy="4.5" r="1.3"></circle><circle cx="11" cy="8" r="1.3"></circle><circle cx="5.5" cy="11.5" r="1.3"></circle></svg></button></sc-if>
<sc-if value="{{footStatus}}"><button class="{{statusCls}}" type="button" aria-label="Sync" aria-description="{{statusAx}}"><svg class="g" viewBox="0 0 16 16" aria-hidden="true"><defs><mask id="fm-{{gid}}" maskUnits="userSpaceOnUse" x="-2" y="-2" width="20" height="20"><rect x="-2" y="-2" width="20" height="20" fill="#fff"></rect><sc-if value="{{sy.slash}}"><path d="M2.5 1.75l12 12.5" stroke="#000" stroke-width="3.4" stroke-linecap="round"></path></sc-if><sc-if value="{{sy.dot}}"><circle cx="13.2" cy="4" r="3.4" fill="#000"></circle></sc-if><sc-if value="{{sy.excl}}"><path d="M8.25 6.1v3" stroke="#000" stroke-width="1.6" stroke-linecap="round"></path><circle cx="8.25" cy="11.05" r="0.95" fill="#000"></circle></sc-if></mask></defs><g mask="url(#fm-{{gid}})"><path class="{{sy.cloud}}" d="M4.6 12.75h6.9a2.85 2.85 0 0 0 .38-5.67 3.9 3.9 0 0 0-7.55-.55A3.1 3.1 0 0 0 4.6 12.75z"></path></g><sc-if value="{{sy.slash}}"><path class="o" d="M2.5 1.75l12 12.5"></path></sc-if><sc-if value="{{sy.dot}}"><circle class="dot" cx="13.2" cy="4" r="2.1"></circle></sc-if></svg><span class="fl">{{statusText}}</span></button><span class="fsp"></span><button class="fb" type="button" aria-label="New List"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg></button><button class="fb" type="button" aria-label="Settings"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h3.2M8.3 4.5h5.2M2.5 8h7.2M12.3 8h1.2M2.5 11.5h1.7M6.8 11.5h6.7"></path><circle cx="7" cy="4.5" r="1.3"></circle><circle cx="11" cy="8" r="1.3"></circle><circle cx="5.5" cy="11.5" r="1.3"></circle></svg></button></sc-if>
</div></sc-if>
</nav>
<div class="lights"><i></i><i></i><i></i></div>
<div class="tb" style="left: 93px"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"></rect><line x1="6" y1="3" x2="6" y2="13"></line></svg></div>
<sc-if value="{{band}}"><button class="tb tbx" type="button" style="left: 125px" aria-label="New List"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg></button><button class="tb tbx" type="button" style="left: 157px" aria-label="Settings"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h3.2M8.3 4.5h5.2M2.5 8h7.2M12.3 8h1.2M2.5 11.5h1.7M6.8 11.5h6.7"></path><circle cx="7" cy="4.5" r="1.3"></circle><circle cx="11" cy="8" r="1.3"></circle><circle cx="5.5" cy="11.5" r="1.3"></circle></svg></button></sc-if>
<sc-if value="{{tip.show}}"><div class="tip" style="{{tip.style}}">{{tip.text}}<span class="k">{{tip.keys}}</span></div></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"dir":{"editor":"enum","options":["actions","status","band","none"],"default":"actions"},"sync":{"editor":"enum","options":["synced","syncing","offline","error"],"default":"synced"},"hover":{"editor":null,"default":"off"},"tip":{"editor":null,"default":"off"},"scroll":{"editor":null,"default":0},"sbw":{"editor":null,"default":230},"wh":{"editor":null,"default":560},"glass":{"editor":null,"default":"off"},"zoom":{"editor":null,"default":1.5},"w":{"editor":null,"default":0},"h":{"editor":null,"default":0},"$preview":{"width":618,"height":888}}'>
// The sidebar footer (INTERACTIONS-v2 §27, proposed): a mock-up of the sidebar alone, three directions.
//   actions: a pinned 36pt foot with + New List and Settings; the sync cloud stays in the header row (§26).
//   status:  the foot carries the sync state instead (text only when hovered or when something's wrong), + and Settings as icons.
//   band:    no foot; + and Settings join the title band beside the toggle, as Rex keeps its actions.
//   none:    the sidebar as it is.
const LISTS = [['Inbox', 'I', 'c-ink', 4], ['School', 'S', 'c-blue', 11], ['PHYS 122', 'P', 'c-yellow', 10], ['Tasks app', 'T', 'c-magenta', 5], ['Home', 'H', 'c-green', 6], ['Errands', 'E', 'c-cyan', 5], ['Reading', 'R', 'c-red', 3], ['Side projects', 'S', 'c-blue', 2], ['Garden', 'G', 'c-green', 1]];
const SYNC = {
  synced:  { g: {}, cls: 's-synced', text: '', hoverText: 'Synced 2 min ago' },
  syncing: { g: {}, cls: 's-syncing', text: 'Syncing…' },
  offline: { g: { slash: 1, dot: 1 }, cls: 's-offline', text: 'Offline · 3 waiting' },
  error:   { g: { excl: 1 }, cls: 's-error', text: 'Sync stopped' },
};
let GID = 0;
class Component extends DCLogic {
  constructor(props) { super(props); this.gid = 'f' + (++GID); this.state = { tip: null }; }
  renderVals() {
    const p = this.props, dir = p.dir || 'actions', theme = p.theme === 'light' ? 'light' : 'dark', z = +(p.zoom || 1.5);
    const sbW = +(p.sbw || 230), H = +(p.wh || 560), foot = dir === 'actions' || dir === 'status', footH = 36;
    const st = SYNC[p.sync || 'synced'], hov = p.hover === 'on';
    // The rows, as §12 lays them out: the header (34), Today 6 below it, rows on a 32pt pitch, labels 32.
    const rows = []; let y = 40;
    const row = (name, tile, mono, count, icon, cur) => { rows.push({ row: true, cls: 'sbi srow' + (cur ? ' cur' : ''), style: 'top: ' + y + 'px', name, tile: 'tile ' + tile, mono, count: count || '', ['i_' + icon]: !!icon }); y += 32; };
    const label = (name, chev) => { rows.push({ label: true, name, chev, style: 'top: ' + y + 'px' }); y += 32; };
    row('Today', 'c-yellow', '', 13, 'today'); row('Upcoming', 'c-magenta', '', '', 'up'); row('Undated', 'c-cyan', '', '', 'und');
    label('Lists');
    for (const [n, m, c] of LISTS) row(n, c, m, '', '', n === 'School');   // lists show no count (2026-10-31)
    y += 8; row('Completed', 'c-green', '', '', 'done'); row('Trash', 'c-ink', '', '', 'trash');
    y += 8; label('Archive', true);
    const contentH = y + 8, top = 50, bottom = foot ? footH : 0, viewH = H - top - bottom;
    const scroll = Math.max(0, Math.min(+(p.scroll || 0), contentH - viewH));
    const moreBelow = scroll + viewH < contentH - 1;
    const tipDefs = { new: ['New List', '⇧⌘N', 18], set: ['Settings', '⌘,', sbW - 40] };
    const tipKey = p.tip && p.tip !== 'off' ? p.tip : this.state.tip;
    const tipD = tipKey && tipDefs[tipKey];
    const statusText = st.text || (hov ? st.hoverText : '');
    return {
      rootCls: 'tk sf ' + theme + (p.glass === 'on' ? ' glass' : ''), glass: p.glass === 'on',
      rootStyle: 'width: ' + (p.w || Math.round(380 * z + 48)) + 'px; height: ' + (p.h || Math.round(H * z + 48)) + 'px',
      scaleStyle: 'position: absolute; left: 24px; top: 24px; transform: scale(' + z + '); transform-origin: 0 0',
      winCls: 'win', winStyle: 'width: 380px; height: ' + H + 'px', sbW, gid: this.gid,
      sbsCls: 'sbs' + (moreBelow && foot ? ' fade' : ''), sbsStyle: 'bottom: ' + bottom + 'px', contentStyle: 'height: ' + contentH + 'px; transform: translateY(' + (-scroll) + 'px)',
      rows, foot, footH, footActions: dir === 'actions', footStatus: dir === 'status', band: dir === 'band',
      headSync: dir !== 'status' && p.sync && p.sync !== 'synced', sy: { ...st.g, cls: 'sync ' + st.cls, cloud: st.g.excl ? 'f' : 'o' },
      newLabel: sbW >= 150 ? 'New List' : '',
      statusCls: 'fstat sync ' + st.cls + (statusText ? '' : ' quiet'), statusText, statusAx: statusText || 'Synced 2 minutes ago',
      tip: tipD ? { show: true, text: tipD[0], keys: tipD[1], style: 'left: ' + tipD[2] + 'px; top: ' + (H - footH - 30) + 'px' } : { show: false },
      tipNew: () => this.setState({ tip: 'new' }), tipSet: () => this.setState({ tip: 'set' }), tipOff: () => this.setState({ tip: null }),
    };
  }
}
</script>
</body>
</html>
