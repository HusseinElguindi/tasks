# The Xcode project is generated from this file: `xcodegen generate` (XcodeGen 2.46, installed with mise).
# The generated Tasks.xcodeproj is not checked in.
name: Tasks
options:
  bundleIdPrefix: com.elguindi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  TasksCore:
    path: TasksCore
targets:
  Tasks:
    type: application
    platform: macOS
    sources:
      # A synchronized folder: files added under Tasks/ are picked up without regenerating the project.
      - path: Tasks
        type: syncedFolder
      # The few widget files the app compiles too: the URL scheme and the feed's place in the group.
      - path: ../widgets/Shared/DeepLink.swift
      - path: ../widgets/Shared/WidgetGroup.swift
    dependencies:
      - package: TasksCore
      - package: TasksCore
        product: TasksTheme
      - target: TasksWidgets # embedded in Contents/PlugIns
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # The scheme the widgets open the app with (DeepLink.swift): tasks, or tasks-dev for the Debug app.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(TASKS_URL_SCHEME)]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.elguindi.tasks.task-ids
            UTTypeDescription: Tasks
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: com.elguindi.tasks.list-id
            UTTypeDescription: Task List
            UTTypeConformsTo: [public.data]
    # The signing identity: Apple Development, team F4AMC8FYKT (Signing.xcconfig).
    configFiles:
      Debug: Signing.xcconfig
      Release: Release.xcconfig # Signing.xcconfig, plus arm64 only and stripped
    settings:
      configs:
        # Debug builds are a separate app to macOS: their own defaults, saved state, Keychain item and data folder,
        # so a development build can never pick up the real app's server, token or data.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.Tasks.dev
          # A different process name too, so window tools that look for "Tasks" never find a dev build.
          PRODUCT_NAME: Tasks Dev
          TASKS_URL_SCHEME: tasks-dev
      base:
        TASKS_URL_SCHEME: tasks
        PRODUCT_NAME: Tasks
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.Tasks
        CODE_SIGN_ENTITLEMENTS: Tasks.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Signing (style, identity, team) is in Signing.xcconfig. No sandbox for the app (spec §7); the widget
        # extension is sandboxed, as WidgetKit requires.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        # Tasks/AppIcon.icon (Icon Composer, picked up by the synced folder). Its source and exports are in
        # design/logo/final; regenerate with design/logo/final/export.sh, which copies it here.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  # The widget extension (design/WIDGETS.md §3.1): sandboxed, as WidgetKit requires on the Mac. It reads only the
  # feed the app writes into the shared group container.
  TasksWidgets:
    type: app-extension
    platform: macOS
    # The views, the providers and the links are shared with the iPhone (../widgets/Shared), and so are its controls
    # (compiled from ios/Widgets, unchanged); the bundle is the Mac's own (Widgets/). Controls need macOS 26.
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
      - path: ../widgets/Shared
      - path: ../ios/Widgets/Controls.swift
    dependencies:
      - package: TasksCore
      - package: TasksCore
        product: TasksTheme
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Signing.xcconfig
      Release: Release.xcconfig # Signing.xcconfig, plus arm64 only and stripped
    settings:
      configs:
        Debug:
          # Under the Debug app's id, so a dev build's widgets stay apart from the real app's.
          PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.Tasks.dev.Widgets
      base:
        PRODUCT_NAME: TasksWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.Tasks.Widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: YES
  # The Mac's side of the theme's tests (design/THEMES.md, COLOR.md; the theme's own are TasksThemeTests in
  # TasksCore) and the edit-session rule's (docs/MAC-EDIT-DURABILITY.md): logic tests on those files alone, with no
  # app host, so running them never launches the app or touches its data.
  TasksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TasksTests
      - path: Tasks/Theme/Theme.swift
      - path: Tasks/Theme/TK.swift
      - path: Tasks/Window/EditSession.swift
      # The large title's type and measure, and the rename field (design/TITLE-RENAME.md).
      - path: Tasks/TaskList/TitleLayout.swift
      - path: Tasks/Theme/InlineField.swift
      # The widgets: the app's feed writer, and the extension's views and providers (drawn to images).
      - path: Tasks/Widgets/WidgetFeedWriter.swift
      - path: Tasks/Support/SyncSchedule.swift
      - path: ../widgets/Shared
    dependencies:
      - package: TasksCore
      - package: TasksCore
        product: TasksTheme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.TasksTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tasks:
    build:
      targets:
        Tasks: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: TasksCore/TasksCoreTests
        - package: TasksCore/TasksThemeTests
        - TasksTests
    archive:
      config: Release
