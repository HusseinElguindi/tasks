# The iOS app. The Xcode project is generated from this file: `xcodegen generate` (XcodeGen 2.46). The generated
# Tasks.xcodeproj is not checked in. It shares app/TasksCore with the Mac app: the data, Today, dates, ordering,
# Markdown and sync are the Mac's own code, and so is the theme (TasksTheme: the tokens, Rex and the lit tiles).
name: Tasks
options:
  bundleIdPrefix: com.elguindi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  TasksCore:
    path: ../app/TasksCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The team comes from Signing.local.xcconfig (not checked in; see Signing.xcconfig), so it isn't set here: a
    # value here would win over the file.
    CODE_SIGN_STYLE: Automatic
targets:
  Tasks:
    type: application
    platform: iOS
    sources:
      - path: Tasks
      # The few widget files the app compiles too: the URL scheme and the feed's place in the App Group.
      - path: ../widgets/Shared/DeepLink.swift
      - path: ../widgets/Shared/WidgetGroup.swift
    dependencies:
      - package: TasksCore
      - package: TasksCore
        product: TasksTheme
      # The widgets (WIDGETS.md §3.1), embedded in the app.
      - target: TasksWidgets
        embed: true
        codeSign: true
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # The tasks:// scheme the widgets open the app with (DeepLink.swift). Merged with the generated Info.plist.
    info:
      path: Tasks/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.elguindi.Tasks
            CFBundleURLSchemes: [tasks]
    # The App Group the app writes the widgets' feed into (WIDGETS.md §3.2); the extension has the same one.
    entitlements:
      path: Tasks/Tasks.entitlements
      properties:
        com.apple.security.application-groups: [group.com.elguindi.Tasks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.Tasks
        CODE_SIGN_ENTITLEMENTS: Tasks/Tasks.entitlements
        PRODUCT_NAME: Tasks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tasks
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # No encryption beyond Apple's (HTTPS): skips the export question on TestFlight.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  # The widget extension (WIDGETS.md §3.1): the views, the provider and the URL builder are in ../widgets/Shared, shared
  # with the Mac's extension later; what only the iPhone has is in Widgets/. It reads the feed the app writes into the
  # App Group and never opens the store.
  TasksWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../widgets/Shared
      - path: Widgets
    dependencies:
      - package: TasksCore
      - package: TasksCore
        product: TasksTheme
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/TasksWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.elguindi.Tasks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.Tasks.Widgets
        PRODUCT_NAME: TasksWidgets
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/TasksWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # Unit tests in the app's process (so they have its App Group): the widgets' feed, the links, and Today as the
  # widget computes it, from three of widgets/Shared's files. Simulator only, like the UI tests.
  TasksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TasksTests
      - path: ../widgets/Shared/TodaySnapshot.swift
      - path: ../widgets/Shared/TodayProvider.swift
      - path: ../widgets/Shared/WidgetGroup.swift
    dependencies:
      - target: Tasks
      - package: TasksCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.TasksTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tasks.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tasks
        BUNDLE_LOADER: $(TEST_HOST)
  TasksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TasksUITests
    dependencies:
      - target: Tasks
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elguindi.TasksUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tasks
schemes:
  Tasks:
    build:
      targets:
        Tasks: all
        TasksTests: [test]
        TasksUITests: [test]
    test:
      targets:
        - TasksTests
        - TasksUITests
      # Full: every UI test (the default, as before). Smoke: a ~6 min set across the app's main paths, for before a phone
      # install (`-testPlan Smoke`; README.md). Its list is in Smoke.xctestplan.
      testPlans:
        - path: Full.xctestplan
          defaultPlan: true
        - path: Smoke.xctestplan
  # TasksCore's own tests and the theme's (TasksThemeTests), run on iOS. Through this project rather than the
  # package's scheme, which also builds the Mac-only CLI (and would write .swiftpm/ into app/TasksCore). A scheme of
  # their own because their copied Resources folder fails ad hoc signing on the simulator, so they run with
  # CODE_SIGNING_ALLOWED=NO (README.md), while the app and its UI tests keep normal signing.
  TasksCoreTests:
    build:
      targets:
        Tasks: [test]   # xcodegen wants a build target; the tests don't use it
    test:
      targets:
        - package: TasksCore/TasksCoreTests
        - package: TasksCore/TasksThemeTests
